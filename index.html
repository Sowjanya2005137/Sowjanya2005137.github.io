<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sowjanya Gadibilli | Software Developer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F9;--surface:#FFFFFF;--ink:#2B1B2E;--muted:#6B5A6E;--rose:#C2255C;--blush:#FCE4EC;--line:#F0D3DC;--on-rose:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1220;--surface:#271A2C;--ink:#FBEFF3;--muted:#C5B0C9;--rose:#FF7FA9;--blush:#3A2440;--line:#4A3352;--on-rose:#1C1220}}
:root[data-theme="dark"]{--bg:#1C1220;--surface:#271A2C;--ink:#FBEFF3;--muted:#C5B0C9;--rose:#FF7FA9;--blush:#3A2440;--line:#4A3352;--on-rose:#1C1220}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.25rem}
nav{display:flex;gap:1.25rem;justify-content:flex-end;padding:1rem 0;font-weight:500;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--rose)}
.hero{display:grid;grid-template-columns:1fr 220px;gap:2.5rem;align-items:center;padding:2rem 0 4rem}
.hero h1{font-size:clamp(2.6rem,8vw,4.8rem);font-weight:800;letter-spacing:-.03em}
.hero h1 span{color:var(--rose)}
.role{font-size:1.25rem;font-weight:500;margin:.9rem 0 .6rem}
.intro{max-width:52ch;color:var(--muted);margin:0 0 1.5rem}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.7rem 1.2rem;border-radius:999px;border:2px solid var(--rose);font-weight:700;text-decoration:none}
.btn.main{background:var(--rose);color:var(--on-rose)}
.btn:hover{background:var(--blush);color:var(--ink)}.btn.main:hover{filter:brightness(1.08);background:var(--rose);color:var(--on-rose)}
